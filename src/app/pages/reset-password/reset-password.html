<section class="page-shell">
  <div class="page-card">
    <div class="page-header">
      <h1>Réinitialiser le mot de passe</h1>
    </div>

    <div *ngIf="tokenMissing" class="state state-error">
      Lien invalide. Veuillez recommencer depuis la page
      <a routerLink="/forgot-password">mot de passe oublié</a>.
    </div>

    <div *ngIf="done" class="state state-success">
      <span class="icon">✓</span>
      <div>
        <strong>Mot de passe réinitialisé !</strong>
        <p>Vous allez être redirigé vers la page de connexion…</p>
      </div>
    </div>

    <form *ngIf="!tokenMissing && !done" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label class="field-group">
        <span class="field-label">Nouveau mot de passe <span class="required">*</span></span>
        <div class="input-wrapper">
          <input [type]="showNew ? 'text' : 'password'" formControlName="newPassword" autocomplete="new-password" />
          <button type="button" class="toggle-pwd" (click)="showNew = !showNew" tabindex="-1">
            {{ showNew ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
        <div class="error" *ngIf="form.get('newPassword')?.hasError('minlength') && form.get('newPassword')?.touched">
          Minimum 8 caractères.
        </div>
      </label>

      <label class="field-group">
        <span class="field-label">Confirmer le mot de passe <span class="required">*</span></span>
        <div class="input-wrapper">
          <input [type]="showConfirm ? 'text' : 'password'" formControlName="confirmPassword" autocomplete="new-password" />
          <button type="button" class="toggle-pwd" (click)="showConfirm = !showConfirm" tabindex="-1">
            {{ showConfirm ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
        <div class="error" *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched">
          Les mots de passe ne correspondent pas.
        </div>
      </label>

      <p class="feedback error" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button type="submit" class="btn-primary" [disabled]="form.invalid || saving">
        {{ saving ? 'Enregistrement…' : 'Réinitialiser mon mot de passe' }}
      </button>
    </form>
  </div>
</section>
