<section class="page-shell">
  <div class="page-card">
    <div class="page-header">
      <h1>Changer mon mot de passe</h1>
      <p class="subtitle">Votre nouveau mot de passe doit contenir au moins 8 caractères</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label class="field-group">
        <span class="field-label">Mot de passe actuel <span class="required">*</span></span>
        <div class="input-wrapper">
          <input [type]="showOld ? 'text' : 'password'" formControlName="oldPassword" autocomplete="current-password" />
          <button type="button" class="toggle-pwd" (click)="showOld = !showOld" tabindex="-1">
            {{ showOld ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
        <div class="error" *ngIf="form.get('oldPassword')?.invalid && form.get('oldPassword')?.touched">
          Ce champ est obligatoire.
        </div>
      </label>

      <label class="field-group">
        <span class="field-label">Nouveau mot de passe <span class="required">*</span></span>
        <div class="input-wrapper">
          <input [type]="showNew ? 'text' : 'password'" formControlName="newPassword" autocomplete="new-password" />
          <button type="button" class="toggle-pwd" (click)="showNew = !showNew" tabindex="-1">
            {{ showNew ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
        <div class="error" *ngIf="form.get('newPassword')?.hasError('minlength') && form.get('newPassword')?.touched">
          Minimum 8 caractères.
        </div>
      </label>

      <label class="field-group">
        <span class="field-label">Confirmer le nouveau mot de passe <span class="required">*</span></span>
        <div class="input-wrapper">
          <input [type]="showConfirm ? 'text' : 'password'" formControlName="confirmPassword" autocomplete="new-password" />
          <button type="button" class="toggle-pwd" (click)="showConfirm = !showConfirm" tabindex="-1">
            {{ showConfirm ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
        <div class="error" *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched">
          Les mots de passe ne correspondent pas.
        </div>
      </label>

      <p class="feedback success" *ngIf="successMsg">{{ successMsg }}</p>
      <p class="feedback error" *ngIf="errorMsg">{{ errorMsg }}</p>

      <div class="actions">
        <button type="button" class="btn-secondary" (click)="cancel()">Annuler</button>
        <button type="submit" class="btn-primary" [disabled]="form.invalid || saving">
          {{ saving ? 'Enregistrement…' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</section>
