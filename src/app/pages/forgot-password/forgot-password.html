<section class="page-shell">
  <div class="page-card">
    <div class="page-header">
      <h1>Mot de passe oublié</h1>
      <p class="subtitle">
        Saisissez votre adresse email et nous vous enverrons un lien pour réinitialiser votre mot de passe.
      </p>
    </div>

    <div *ngIf="sent" class="state state-success">
      <span class="icon">✓</span>
      <div>
        <strong>Email envoyé !</strong>
        <p>Vérifiez votre boîte de réception et suivez les instructions dans l'email.</p>
      </div>
    </div>

    <form *ngIf="!sent" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label class="field-group">
        <span class="field-label">Adresse email <span class="required">*</span></span>
        <input type="email" formControlName="email" placeholder="vous@exemple.fr" autocomplete="email" />
        <div class="error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Adresse email invalide.
        </div>
      </label>

      <p class="feedback error" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button type="submit" class="btn-primary" [disabled]="form.invalid || sending">
        {{ sending ? 'Envoi en cours…' : 'Envoyer le lien' }}
      </button>
    </form>

    <div class="back-link">
      <a routerLink="/connexion">← Retour à la connexion</a>
    </div>
  </div>
</section>
